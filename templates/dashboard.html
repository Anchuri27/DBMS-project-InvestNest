<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>InvestNest Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            color: #1f2937;
        }

        .card {
            background-color: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .cash {
            font-size: 28px;
            font-weight: bold;
            color: #15803d;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #f1f5f9;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .reset-button {
            background-color: #dc2626;
            color: white;
        }

        .reset-button:hover {
            background-color: #b91c1c;
        }

        .logout-button {
            background-color: #374151;
            color: white;
        }

        .logout-button:hover {
            background-color: #1f2937;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>InvestNest Dashboard</h1>

    <div class="card">

        <h2>Welcome, {{ username }}</h2>

        <p>Cash Balance</p>

        <div class="cash">
            ₹{{ "%.2f"|format(cash_balance) }}
        </div>

    </div>


    <div class="card">

        <h2>My Holdings</h2>

        {% if holdings %}

        <table>

            <tr>
                <th>Stock</th>
                <th>Quantity</th>
            </tr>

            {% for holding in holdings %}

            <tr>
                <td>{{ holding.ticker }}</td>
                <td>{{ holding.quantity }}</td>
            </tr>

            {% endfor %}

        </table>

        {% else %}

        <p>No stocks currently held.</p>

        {% endif %}

    </div>


    <div class="card">

        <h2>Portfolio Actions</h2>

        <form
            method="POST"
            action="{{ url_for('reset_portfolio') }}"
            onsubmit="return confirm('Are you sure you want to reset your portfolio? All your transactions will be deleted and your cash will return to ₹1,00,000.');"
        >

            <button type="submit" class="reset-button">
                Reset Portfolio
            </button>

        </form>

        <br>

        <a href="{{ url_for('logout') }}">
            <button type="button" class="logout-button">
                Logout
            </button>
        </a>

    </div>

</div>

</body>
</html>
